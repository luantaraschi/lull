  <g fill="#14181b">
    <rect x="5" y="8" width="3" height="12" />
    <rect x="11" y="8" width="3" height="12" />
    <rect x="17" y="8" width="3" height="12" />
  </g>
  <rect x="5" y="23" width="22" height="4" fill="#2a2470" />
</svg>
