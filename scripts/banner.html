<!doctype html>
<!-- Source for the theme-aware, name-only wordmark at the top of the README. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lull banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14181b;
      }

      :root[data-theme='dark'] {
        --ink: #f1f3f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1280px;
        height: 280px;
        background: transparent;
        color: var(--ink);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wordmark {
        font-size: 176px;
        font-weight: 500;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <span class="wordmark">lull</span>

    <script>
      document.documentElement.dataset.theme = location.hash === '#dark' ? 'dark' : 'light'
    </script>
  </body>
</html>
